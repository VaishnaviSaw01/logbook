services:
  # Optional self-hosted MongoDB for local dev, so you don't need Atlas
  # credentials just to run the app on your machine. Not started by
  # default — opt in with: docker compose --profile local-mongo up --build
  # and point MONGO_URI (in .env) at mongodb://mongo:27017/logbookDB
  mongo:
    image: mongo:7
    profiles: ["local-mongo"]
    ports:
      - "27017:27017"
    volumes:
      - logbook-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    restart: unless-stopped

  customer-service:
    build: ./services/customer-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    restart: unless-stopped

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    restart: unless-stopped

  transaction-service:
    build: ./services/transaction-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    restart: unless-stopped

  insights-service:
    build: ./services/insights-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      # Optional — AI Insights/reminder drafting fall back to rule-based
      # text when this isn't set. Get a key at console.anthropic.com.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - customer-service
      - inventory-service
      - transaction-service
      - insights-service
    restart: unless-stopped

volumes:
  logbook-mongo-data:
