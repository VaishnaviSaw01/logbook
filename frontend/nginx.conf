server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy each backend prefix to its service.
    #
    # This only matters for `docker compose up` (see docker-compose.yml,
    # where these hostnames are the other containers' service names). In
    # the Kubernetes deployment, k8s/ingress/ingress.yaml routes these
    # same "/api/..." prefixes directly to each backend Service, so
    # requests never actually reach this nginx for them there — but
    # keeping the same prefixes here means the exact same frontend image
    # works unmodified in both environments.
    location /api/auth {
        proxy_pass http://auth-service:3001;
        proxy_set_header Host $host;
    }

    location /api/staff {
        proxy_pass http://auth-service:3001;
        proxy_set_header Host $host;
    }

    location /api/parties {
        proxy_pass http://customer-service:3002;
        proxy_set_header Host $host;
    }

    location /api/inventory {
        proxy_pass http://inventory-service:3003;
        proxy_set_header Host $host;
    }

    location /api/transactions {
        proxy_pass http://transaction-service:3004;
        proxy_set_header Host $host;
    }

    location /api/insights {
        proxy_pass http://insights-service:3005;
        proxy_set_header Host $host;
    }

    # React Router client-side routes (e.g. /customers, /inventory) must
    # all resolve to index.html so the SPA's router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not
    # hashed and must always be revalidated so deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
