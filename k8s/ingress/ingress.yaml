apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: logbook-ingress
  namespace: logbook

spec:
  ingressClassName: nginx

  rules:
  - http:
      paths:

      # No rewrite-target here on purpose: each backend service mounts
      # its routes under this exact same "/api/..." prefix (see each
      # service's server.js), and the frontend also calls these same
      # relative "/api/..." paths — so the path must pass through
      # unchanged for both sides to agree on it.

      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80

      - path: /api/staff
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80

      - path: /api/parties
        pathType: Prefix
        backend:
          service:
            name: customer-service
            port:
              number: 80

      - path: /api/inventory
        pathType: Prefix
        backend:
          service:
            name: inventory-service
            port:
              number: 80

      - path: /api/transactions
        pathType: Prefix
        backend:
          service:
            name: transaction-service
            port:
              number: 80

      - path: /api/insights
        pathType: Prefix
        backend:
          service:
            name: insights-service
            port:
              number: 80

      # Everything else (the React app and its client-side routes) goes
      # to the frontend. Must be listed last / least specific.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
