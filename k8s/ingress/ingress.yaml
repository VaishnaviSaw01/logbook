apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: logbook-ingress
  namespace: logbook

spec:
  ingressClassName: nginx

  rules:
  - http:
      paths:

      - path: /auth
        pathType: Prefix

        backend:
          service:
            name: auth-service

            port:
              number: 80

      - path: /customer
        pathType: Prefix

        backend:
          service:
            name: customer-service

            port:
              number: 80

      - path: /inventory
        pathType: Prefix

        backend:
          service:
            name: inventory-service

            port:
              number: 80

      - path: /transaction
        pathType: Prefix

        backend:
          service:
            name: transaction-service

            port:
              number: 80