# Template for the Secret all five backend deployments read via
# secretKeyRef (see k8s/*/deployment.yaml). Copy this file to
# k8s/secret.yaml, fill in real values, and DO NOT commit that copy —
# k8s/secret.yaml is already in .gitignore.
#
# Quicker alternative to editing a file at all:
#   kubectl create secret generic logbook-secrets \
#     --namespace logbook \
#     --from-literal=MONGO_URI='mongodb+srv://<user>:<password>@<cluster-host>/logbookDB?retryWrites=true&w=majority' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ANTHROPIC_API_KEY='<optional — from console.anthropic.com>'
#
# IMPORTANT: earlier commits in this repository's history hardcoded a
# real MongoDB Atlas connection string and a real JWT_SECRET directly in
# the deployment YAMLs. Both were exposed publicly. Rotate the MongoDB
# Atlas database user's password and generate a brand new JWT_SECRET
# before relying on this app in production — removing them from HEAD
# does not remove them from git history.
apiVersion: v1
kind: Secret
metadata:
  name: logbook-secrets
  namespace: logbook
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<user>:<password>@<cluster-host>/logbookDB?retryWrites=true&w=majority"
  JWT_SECRET: "<generate a long random value, e.g. `openssl rand -base64 48`>"
  # Optional — powers the AI Insights tab's real AI-generated text.
  # Leave as an empty string to run on rule-based fallback text instead.
  ANTHROPIC_API_KEY: ""
